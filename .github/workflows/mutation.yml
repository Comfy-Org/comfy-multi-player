name: Mutation testing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker mutation testing
    runs-on: ubuntu-latest
    # A job that runs past GitHub's omitted-`timeout-minutes` 360 minute default
    # is CANCELLED, and a cancelled job skips its `if: always()` steps too — so
    # the 2026-09-18 run ended at 21617s (360.3 min, i.e. killed exactly by that
    # default) with no failed log and no uploaded report, leaving nothing to
    # diagnose (cifix-16989). Bound the job just under the default so the cap is
    # ours and visible here. Deliberately NOT lowered further: the caps exist to
    # make a runaway legible, not to shorten the budget a full cold run needs.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Use a unique save key per run and restore the newest compatible report.
      # Including the lockfile and Stryker config prevents results produced with
      # different dependencies or measurement pins from being reused.
      - name: Restore incremental mutation report
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs') }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs') }}-

      # Step-level, and deliberately tighter than the job cap above: a step that
      # times out is marked FAILED and the job keeps going, so the two
      # `if: always()` steps below still run and still upload whatever
      # reports/mutation/ holds. A job-level cancellation would skip them. This
      # is what turns a runaway from "cancelled, no log" into a diagnosable red.
      #
      # This does NOT make a cold run fit. Measured 2026-09-20 on the cifix-16989
      # fix: 4766 mutants over 5 files, `coverageAnalysis: "all"`, concurrency 4,
      # and a 58s full suite — so a cold run is hours and 2026-09-18 exceeded 360
      # minutes. `incremental: true` is supposed to absorb that, but the report is
      # only written by a run that COMPLETES, and no run has completed since the
      # cache key was adopted, so every run restores nothing and pays full cost.
      # Breaking that bootstrap loop needs a measurement decision about the pinned
      # knobs (or a sharded/seeded first run) and is deliberately left to its own
      # change rather than smuggled in behind a timeout.
      - name: Mutation tests
        timeout-minutes: 345
        run: npm run test:mutation

      # Stryker scores a `Timeout` as killed, so a loaded runner inflates the
      # score. `stryker.config.mjs` pins timeoutMS/concurrency; this re-derives
      # the score from the JSON report, reports Timeout as its own outcome, and
      # exits 2 INCONCLUSIVE when timeouts are material. Runs even when Stryker
      # broke the threshold, so the failure is explained rather than just red.
      - name: Check mutation report
        if: always()
        run: npm run check:mutation-report

      # Without this the run discards reports/mutation/ and even a failure
      # leaves nothing to inspect.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: error
