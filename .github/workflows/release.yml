name: Release

on:
  push:
    tags:
      - "v*"
  # Same run, started deliberately rather than by a tag push — used by
  # auto-tag-release.yml, whose GITHUB_TOKEN-created tag cannot raise `push`.
  # DISPATCH THIS AT THE RELEASE TAG, NEVER AT A BRANCH:
  #   gh workflow run release.yml --ref v1.2.3
  # The gate below and scripts/release-retry.mjs both require the run's ref to
  # be refs/tags/v<package version>, and npm stamps that ref into the SLSA
  # provenance this release verifies. Dispatching on main fails at the gate.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: verify / publish / release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin release npm
        # Older CLIs can silently ignore --include-attestations.
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Require tag to match package version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Holds for a tag push and for a dispatch at the tag alike; rejects a
          # dispatch aimed at a branch before any gate or publish work happens.
          test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install
        run: npm ci

      - name: Verify conformance corpus
        run: npm run verify:corpus

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run verify:package

      - name: Type-check gate
        run: npm run typecheck

      - name: Purity gate
        run: npm run check:purity

      - name: Statelessness gate
        run: npm run check:stateless

      - name: Profile-claim staleness gate
        run: npm run check:profile-claims

      - name: CodeRabbit config drift gate
        run: npm run check:coderabbit

      - name: Import-graph gate
        run: npm run check:imports

      - name: Citation-pin gate (FC-10)
        run: npm run check:pins

      - name: Tests
        # check:stateless already runs this behavioral probe explicitly.
        run: npm test -- --exclude test/stateless.test.ts

      - name: Clock ordering matrix
        run: npm run test:clock-matrix

      - name: Verify identity and recover release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-retry.mjs

      - name: Retain exact release tarballs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmp-release-*/*.tgz
          if-no-files-found: ignore
          retention-days: 7
