name: CI - Secret Scanning

# TruffleHog verified-secret scan, modeled on Comfy-Org/cloud's
# ci-secret-scanning.yml (no reusable workflow exists for this in
# Comfy-Org/github-workflows — it's a small enough job that each repo just
# runs the action directly). No secrets needed to run this workflow itself.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # PR revisions share a group and supersede older scans. Each main push gets
  # a unique group so GitHub cannot replace a pending commit-range scan.
  group: secret-scan-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog verified secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitHub's own secret scanning / push protection are not enabled for
      # this repository, so this is the only verified-secret gate it has.
      # Verified live credentials fail the check; unknown/unverifiable
      # patterns are not promoted to blocking findings.
      - name: Scan changed commits for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          extra_args: --only-verified
