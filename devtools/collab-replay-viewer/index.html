<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Collaboration Replay</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><div><p class="eyebrow">DEV-ONLY · READ-ONLY TRACE</p><h1 id="title">Collaboration Replay</h1><p id="source"></p></div><label class="file">Load trace<input id="file" type="file" accept="application/json,.json"></label></header>
<main><aside><h2>Filters</h2><label>Actor<select id="actor"></select></label><label>Target<select id="target"></select></label><label>Outcome<select id="outcome"></select></label><p class="boundary">Captured facts only. This viewer cannot apply operations, choose winners, or mutate a workflow.</p></aside>
<section class="content"><nav><button id="prev" aria-label="Previous step">←</button><input id="scrubber" type="range" min="0" value="0"><button id="next" aria-label="Next step">→</button><output id="count"></output></nav><article id="step" class="step"></article><div class="compare"><section><h2>Before projection</h2><div id="before"></div></section><section><h2>After projection</h2><div id="after"></div></section></div></section></main><script type="module" src="./app.mjs"></script></body></html>
